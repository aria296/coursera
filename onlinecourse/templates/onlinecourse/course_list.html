{% extends "onlinecourse/base.html" %}
{% block title %}Courses{% endblock %}
{% block content %}
<h1 class="mb-4">Available Courses</h1>
<div class="row g-3">
{% for course in courses %}
  <div class="col-md-6"><div class="card h-100 shadow-sm"><div class="card-body">
    <h2 class="h5">{{ course.name }}</h2><p>{{ course.description }}</p>
    <a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">View course</a>
  </div></div></div>
{% empty %}
  <p>No courses yet. Add a course in the admin site.</p>
{% endfor %}
</div>
{% endblock %}
